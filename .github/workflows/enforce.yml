name: enforce

on:
  pull_request:
  push:
    branches:
      - master

env:
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

jobs:
  enforce:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: review-gate tests
        run: node scripts/check/review-gate.test.mjs

      - name: relay-handshake tests
        run: node scripts/check/relay-handshake.test.mjs

      - name: role-guard tests
        run: node scripts/check/role-guard.test.mjs

      - name: hooks POSIX syntax check
        run: |
          sh -n hooks/commit-msg
          sh -n hooks/pre-commit

      - name: Install gitleaks (pinned, checksum-verified)
        run: |
          set -e
          curl -sSL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          chmod +x gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks

      - name: gitleaks secret scan
        run: gitleaks detect --source . --redact
